GNULIB_REVISION=0ba13435a9362bec0ff5fd0830907b9fac723e41

# gnulib modules used by this package.
gnulib_modules="
  attribute
  dirname
  environ
  error
  full-write
  gitlog-to-changelog
  gnupload
  largefile
  lib-ignore
  manywarnings
  mkdtemp
  nullptr
  raise
  safe-read
  safe-write
  setenv
  sigaction
  signal-h
  sigprocmask
  strerror
  strsignal
  sys_select
  sys_stat
  unsetenv
  verror
  waitpid
  warnings
  xalloc
  xstrndup
  xvasprintf
"

gnulib_tool_option_extras="\
 --no-conditional-dependencies \
 --libtool \
 --macro-prefix=gl \
 --no-vc-files \
"

# This doesn't currently exist, but we set it to avoid confusion with 'gl'
# as the local output directory.
local_gl_dir=gnulib-local

gnulib_name=libgnu
source_base=gl/lib
m4_base=gl/m4

checkout_only_file=
copy=true
vc_ignore=

SKIP_PO=t

# Build prerequisites
buildreq="\
autoconf   2.64
automake   1.14
git        1.5.5
"
